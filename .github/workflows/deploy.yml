name: Deploy

# Build the two images, push them to GHCR, then SSH to the VPS and roll the
# /srv/traveller stack forward to the freshly-built tag. Kept separate from
# ci.yml (which lints/tests/builds on every push) — this only runs for main.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: shvedoff1
  # Baked into the web client bundle at build time (see apps/web/Dockerfile).
  SITE_URL: https://traveller.shvedov.tech

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - app: api
            dockerfile: apps/api/Dockerfile
          - app: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/traveller-${{ matrix.app }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # NEXT_PUBLIC_* is inlined at build time; ignored by the api image.
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.SITE_URL }}
          cache-from: type=gha,scope=traveller-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=traveller-${{ matrix.app }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve short SHA
        id: sha
        run: echo "short=sha-$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: TAG
          script: |
            set -euo pipefail
            cd /srv/traveller
            export TAG="${TAG}"
            echo "Deploying traveller @ ${TAG}"
            docker compose pull
            docker compose up -d
            # Caddy (in the blog stack) caches upstream DNS — bounce it so it
            # re-resolves the recreated traveller-api/traveller-web containers.
            docker restart "$(docker ps -qf name=caddy)" 2>/dev/null || \
              echo "no caddy container found — skipping bounce"
            docker image prune -f
        env:
          TAG: ${{ steps.sha.outputs.short }}
