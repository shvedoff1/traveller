name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: traveller
          POSTGRES_PASSWORD: traveller
          POSTGRES_DB: traveller_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U traveller"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://traveller:traveller@localhost:5432/traveller_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret
      WEB_ORIGIN: http://localhost:3000
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      # The workflow exists from the first commit, before any code does.
      # Guard every step on the lockfile so pre-scaffold pushes stay green.
      - name: Check for workspace
        id: workspace
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No pnpm-lock.yaml yet — skipping build/test (pre-scaffold commit)."
          fi

      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v4
        if: steps.workspace.outputs.exists == 'true'

      - uses: actions/setup-node@v4
        if: steps.workspace.outputs.exists == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.workspace.outputs.exists == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: steps.workspace.outputs.exists == 'true'
        run: pnpm turbo lint

      - name: Typecheck
        if: steps.workspace.outputs.exists == 'true'
        run: pnpm turbo typecheck

      - name: Test
        if: steps.workspace.outputs.exists == 'true'
        run: pnpm turbo test

      - name: Build
        if: steps.workspace.outputs.exists == 'true'
        run: pnpm turbo build
